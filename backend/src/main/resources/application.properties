spring.application.name=personal-web-backend
server.forward-headers-strategy=framework

# Database configuration
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB:personalwebdb}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Mail configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Blog configuration (Admin & Image Uploads)
app.admin.password=${ADMIN_PASSWORD}
app.upload.dir=/app/uploads/blog
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB